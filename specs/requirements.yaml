      - name: id
        type: uuid
        required: true
      - name: webhook_config_id
        type: uuid
        required: true
      - name: workspace_id
        type: uuid
        required: true
      - name: event_type
        type: string
        required: true
      - name: payload
        type: json
        required: true
      - name: status_code
        type: int
        required: false
      - name: delivery_status
        type: enum
        values:
          - pending
          - succeeded
          - failed
        required: true
      - name: attempt_count
        type: int
        required: true
      - name: last_error
        type: string
        required: false
      - name: created_at
        type: datetime
        required: true
      - name: updated_at
        type: datetime
        required: true
  - name: AuditLog
    fields:
      - name: id
        type: uuid
        required: true
      - name: workspace_id
        type: uuid
        required: false
      - name: user_id
        type: uuid
        required: false
      - name: actor_type
