api:
  base_url: /api
  endpoints:
    - id: E_auth_login
      path: /auth/login
      method: POST
      request:
        body:
          - email
          - password
      response:
        success: true
        fields:
          - token
          - user
      auth_required: false
    - id: E_auth_register
      path: /auth/register
      method: POST
      request:
        body:
          - full_name
          - email
          - password
          - workspace_name
      response:
        success: true
        fields:
          - token
          - user
          - workspace
      auth_required: false
    - id: E_me
      path: /auth/me
      method: GET
      request:
        body: []
      response:
        success: true
        fields:
          - user
          - workspaces
          - current_workspace
      auth_required: true
    - id: E_projects_list
      path: /projects
      method: GET
      request:
        body: []
      response:
        success: true
        fields:
          - projects
      auth_required: true
    - id: E_projects_create
      path: /projects
      method: POST
      request:
        body:
          - name
          - description
      response:
        success: true
        fields:
          - project
      auth_required: true
    - id: E_templates_list
      path: /templates
      method: GET
      request:
        body: []
      response:
        success: true
        fields:
          - templates
      auth_required: true
    - id: E_templates_create
      path: /templates
      method: POST
      request:
        body:
          - name
          - description
          - document_type
          - field_schema
          - default_export_format
          - project_id
      response:
        success: true
        fields:
          - template
      auth_required: true
    - id: E_templates_update
      path: /templates/:templateId
      method: PUT
      request:
        body:
          - name
          - description
          - document_type
          - field_schema
          - default_export_format
      response:
        success: true
        fields:
          - template
      auth_required: true
    - id: E_documents_upload
      path: /documents
      method: POST
      request:
        body:
          - project_id
          - template_id
          - file
      response:
        success: true
        fields:
          - document
          - job_id
      auth_required: true
    - id: E_documents_get
      path: /documents/:documentId
      method: GET
      request:
        body: []
      response:
        success: true
        fields:
          - document
          - extraction_result
          - logs
      auth_required: true
    - id: E_documents_retry
      path: /documents/:documentId/retry
      method: POST
      request:
        body: []
      response:
        success: true
        fields:
          - document
          - job_id
      auth_required: true
    - id: E_extractions_export
      path: /documents/:documentId/export
      method: GET
      request:
        body: []
      response:
        success: true
        fields:
          - download_url
      auth_required: true
    - id: E_api_keys_list
      path: /api-keys
      method: GET
      request:
        body: []
      response:
        success: true
        fields:
          - api_keys
      auth_required: true
    - id: E_api_keys_create
      path: /api-keys
      method: POST
      request:
        body:
          - name
          - scopes
          - expires_at
      response:
        success: true
        fields:
          - api_key
          - plaintext_key
      auth_required: true
    - id: E_api_keys_revoke
      path: /api-keys/:apiKeyId/revoke
      method: POST
      request:
        body: []
      response:
        success: true
        fields:
          - api_key
      auth_required: true
    - id: E_webhooks_get
      path: /webhooks
      method: GET
      request:
        body: []
      response:
        success: true
        fields:
          - webhooks
      auth_required: true
    - id: E_webhooks_upsert
      path: /webhooks
      method: POST
      request:
        body:
          - target_url
          - secret
          - events
          - retry_policy
          - enabled
      response:
        success: true
        fields:
          - webhook
      auth_required: true
    - id: E_webhooks_test
      path: /webhooks/test
      method: POST
      request:
        body:
          - webhook_id
      response:
        success: true
        fields:
          - delivery
      auth_required: true
    - id: E_usage_summary
      path: /usage/summary
      method: GET
      request:
        body: []
      response:
        success: true
        fields:
          - current_period
          - documents_processed
          - pages_processed
          - plan_limits
      auth_required: true
    - id: E_public_extract_via_api_key
      path: /v1/documents:extract
      method: POST
      request:
        body:
          - template_id
          - file
          - callback_url
      response:
        success: true
        fields:
          - document_id
          - status
      auth_required: true
integrations:
  email_provider: resend
  payment_provider: stripe
  external_apis:
    - name: Zapier
      purpose: Provide workflow automations triggered by webhooks or polling endpoints
      auth_type: api_key_webhook
    - name: Make
      purpose: Scenario-based workflow automations via webhooks and HTTP modules
      auth_type: api_key_webhook
    - name: n8n
      purpose: Self-hosted workflow automations using HTTP Request and Webhook nodes
      auth_type: api_key_webhook
non_functional:
  performance:
    ttfb_ms: 300
    max_page_load_s: 2000
  availability: 99.9%
  scalability: multi-tenant ready
  logging: true
  monitoring: true
  seo: true
out_of_scope:
  - Building custom official Zapier, Make, or n8n marketplace apps (initially documented
    as generic webhook/API flows only)
  - On-premise deployment for customers
  - Advanced AI model training UI beyond template-based extraction configuration
  - Role-based access control finer than the defined roles
  - Native mobile applications (web app only)
open_questions: []
tech_stack:
  infrastructure:
    deployment_type: serverless
    storage_provider: local
    database: postgres
    reverse_proxy: nginx
  frontend:
    framework: nextjs
    css_framework: tailwind
    ui_library: shadcn
    icon_library: lucide
    typescript: true
    app_router: true
  backend:
    framework: fastapi
    orm: sqlalchemy
    database: postgres
    language: python
  deployment:
    containerization: docker
    orchestration: docker_compose
    web_server: nginx
    process_manager: none
branding:
  product_name: DocFoundry.app
  tagline: Forge any document into clean, usable data.
  brand_voice:
    - "Technical but approachable: speak clearly to developers and ops leaders without
      jargon for its own sake; explain complex ideas in simple, concrete language."
    - "Confident and precise: emphasize reliability, accuracy, and observability; avoid
      hype and vague claims, back benefits with specifics (logs, quotas, metrics)."
    - "Action-oriented and instructional: favor step-by-step phrasing, code-friendly
      examples, and direct calls to action that help users integrate quickly."
    - "Calm, trustworthy, and enterprise-ready: adopt a steady, responsible tone around\
      \ security, audit logging, and billing\u2014no jokes around compliance-critical\
      \ workflows."
    - "API-first and automation-minded: naturally reference webhooks, Zapier/Make/n8n,
      and REST APIs; write like a helpful senior engineer guiding implementation."
  color_palette:
    primary:
      hex: "#2563EB"
      usage:
        Primary actions (CTA buttons, key links, active navigation states) and
        highlight elements in charts or status badges.
    secondary:
      hex: "#0F172A"
      usage:
        Headers, navigation bar background, and panels that need a strong, professional
        feel (e.g., admin and billing sections).
    accent:
      hex: "#22C55E"
      usage:
        Success states, processed/healthy indicators, usage under-limit visuals,
        and subtle accent lines or icons in the UI.
    background:
      hex: "#F9FAFB"
      usage:
        App-wide background, marketing site sections, and neutral areas behind
        cards and tables to reduce visual noise.
    text:
      hex: "#111827"
      usage:
        Primary body text, labels, and high-contrast text on light backgrounds
        for optimal readability in dashboards and docs.
  typography:
    heading_font: Inter
    body_font: Inter
