app:
  name: DocData SaaS
  description:
    A multi-tenant SaaS for turning unstructured documents (PDFs, images,
    receipts, invoices, contracts, shipping docs, CVs, forms, scans) into structured
    data using customizable extraction templates, with APIs, webhooks, and automation
    platform integrations.
  target_users:
    - SaaS companies needing document data extraction as a service
    - Operations and logistics teams processing shipping and packing documents
    - Accounting and finance teams processing receipts and invoices
    - HR teams processing CVs and standardized forms
    - Developers integrating document parsing into their apps or workflows
    - Automation consultants using Zapier, Make, and n8n
  business_model: SaaS
  domain: document_processing
core_features:
  authentication:
    type: email_password
    providers:
      - google
    session_type: jwt_cookie
    extra_security:
      - email_verification
      - password_reset
      - 2fa_optional
  payments:
    provider: stripe
    billing_model: hybrid
    plans:
      - id: basic
        price: "29"
        interval: monthly
        features_included:
          - Up to 1,000 pages per month
          - 1 team member
          - Up to 5 extraction templates
          - Email support
          - API & webhook access
      - id: pro
        price: "99"
        interval: monthly
        features_included:
          - Up to 10,000 pages per month
          - 5 team members
          - Unlimited extraction templates
          - Priority support
          - API & webhook access
          - Zapier/Make/n8n integrations
  roles:
    - id: admin
      permissions:
        - "*"
    - id: owner
      permissions:
        - workspace:*
        - user:invite
        - user:remove
        - billing:*
        - templates:*
        - documents:*
        - exports:*
        - apikeys:*
        - webhooks:*
        - usage:view
    - id: member
      permissions:
        - templates:create
        - templates:view
        - templates:update
        - documents:upload
        - documents:view
        - documents:retry
        - exports:download
        - apikeys:view
        - webhooks:view
    - id: readonly
      permissions:
        - templates:view
        - documents:view
        - exports:download
        - usage:view
  audit_logging:
    enabled: true
    events:
      - login
      - logout
      - create
      - update
      - delete
      - billing_update
      - template_run
      - api_key_used
      - webhook_sent
      - webhook_failed
      - file_uploaded
      - extraction_retried
      - plan_changed
  notifications:
    channels:
      - email
      - in_app
    events:
      - welcome_new_user
      - email_verification
      - password_reset
      - subscription_created
      - subscription_canceled
      - payment_failed
      - usage_threshold_80
      - usage_threshold_100
      - webhook_failures_exceeded
      - api_key_expiring
      - api_key_rotated
  file_uploads:
    storage_provider: local
    max_file_size_mb: 25
  custom_features:
    - Multi-tenant workspaces with usage metering per subscription
    - Custom extraction template editor for mapping document fields to JSON keys
    - Document processing job queue with retry logic
    - Extraction preview UI with JSON/CSV/Excel export
    - API key management and REST API for programmatic extraction
    - Webhook configuration with delivery logs and signature verification
    - Integration guides and snippets for Zapier, Make, and n8n
    - Brandable UI (logo, primary color, app name) per workspace
    - Project folders for organizing documents and templates
    - Extraction logs and status history
roles:
  - id: admin
    description: Platform administrator with full access across all workspaces
    permissions:
      - admin:*
      - user:impersonate
      - billing:view_all
      - system:settings
      - system:monitoring
      - system:audit_logs
  - id: owner
    description: Workspace owner with full access within their workspace including billing
    permissions:
      - workspace:*
      - user:invite
      - user:remove
      - user:role:update
      - billing:*
      - templates:*
      - documents:*
      - exports:*
      - apikeys:*
      - webhooks:*
      - usage:view
      - branding:update
  - id: member
    description: Standard workspace member who can manage documents and templates
    permissions:
      - templates:create
      - templates:view
      - templates:update
      - templates:run
      - documents:upload
      - documents:view
      - documents:retry
      - exports:download
      - apikeys:view
      - webhooks:view
      - projects:manage
  - id: readonly
    description: Read-only user who can review extractions and exports
    permissions:
      - templates:view
      - documents:view
      - exports:download
      - usage:view
personas:
  - id: ops_manager
    name: Operations Manager Olivia
    goals:
      - Automate data entry from shipping and packing documents
      - Reduce manual errors and processing time
      - Monitor processing volume and costs
    pain_points:
      - Manual data entry is slow and error-prone
      - Hard to standardize fields across different document types
    permissions_role: owner
  - id: developer
    name: Developer Dan
    goals:
      - "Embed document parsing into their company\u2019s app"
      - Integrate via API, webhooks, and automation tools
      - Manage API keys and monitor usage programmatically
    pain_points:
      - Existing OCR APIs are low-level and require heavy post-processing
      - Complex authentication and lack of clear documentation
    permissions_role: member
  - id: accountant
    name: Accountant Alice
    goals:
      - Process invoices and receipts into accounting system
      - Export structured data as CSV/Excel
    pain_points:
      - Receipts and invoices come in many formats
      - Need consistent fields for bookkeeping
    permissions_role: member
  - id: automation_consultant
    name: Automation Consultant Amir
    goals:
      - Build workflows in Zapier/Make/n8n involving document parsing
      - Quickly test templates and exports
    pain_points:
      - Difficult to get reliable structured data from documents
    permissions_role: owner
user_journeys:
  - id: signup_and_first_extraction
    title: New user signs up and runs first extraction
    steps:
      - User lands on marketing site and clicks 'Start Free Trial'.
      - User signs up with email/password or Google, verifies email.
      - User creates a workspace and is taken to onboarding in the dashboard.
      - User creates their first project folder, e.g. 'Invoices'.
      - User uploads a sample invoice PDF.
      - User creates a new extraction template and defines key fields (e.g. vendor_name,
        invoice_number, total_amount).
      - User maps template fields to JSON keys and runs test extraction.
      - Extraction completes via background job; user sees JSON preview and sample CSV/Excel
        export.
      - User saves template and configures an API key for programmatic use.
  - id: api_integration_with_webhook
    title: Developer integrates API and webhooks
    steps:
      - Developer logs into dashboard and goes to API Keys screen.
      - Developer creates a new API key with a descriptive name and restricted scopes.
      - Developer reads API docs / integration guide page.
      - Developer configures a webhook endpoint in Webhook Setup with secret for signature
        verification.
      - Developer sends test document via REST API using an extraction template ID.
      - System processes document via job queue and posts result to webhook URL.
      - Developer validates signature and parses received JSON into their system.
  - id: usage_monitoring_and_billing
    title: Owner monitors usage and updates subscription
    steps:
      - Owner visits Usage & Billing page in the dashboard.
      - "Owner views current month\u2019s document/page usage and historical charts."
      - Owner sees they are approaching plan limits and upgrade recommendation.
      - Owner upgrades from Basic to Pro plan through Stripe-hosted checkout or billing
        portal.
      - System updates plan, increases quotas, and shows confirmation.
  - id: integration_with_zapier_make_n8n
    title: Automation consultant sets up Zapier/Make/n8n workflow
    steps:
      - User visits Integrations screen and selects Zapier, Make, or n8n guide.
      - User follows step-by-step instructions to configure triggers/actions using webhooks
        or API calls.
      - User uses provided examples and payloads to map fields in their automation tool.
      - Workflow is activated and sends documents or receives extracted data as part of
        multi-step flows.
screens:
  - id: S_auth_login
    name: Login
    route: /login
    purpose: Authenticate user
    roles_allowed:
      - guest
    components:
      - type: form
        id: login_form
        fields:
          - email
          - password
        actions:
          - submit
          - forgot_password
          - login_with_google
  - id: S_auth_register
    name: Register
    route: /register
    purpose: User registration and workspace creation
    roles_allowed:
      - guest
    components:
      - type: form
        id: register_form
        fields:
          - full_name
          - email
          - password
          - workspace_name
        actions:
          - submit
          - login_instead
  - id: S_dashboard_main
    name: User Dashboard
    route: /app
    purpose: Overview of projects, recent activity, usage, and quick actions
    roles_allowed:
      - owner
      - member
      - readonly
    components:
      - type: header
        id: main_header
        fields:
          - workspace_switcher
          - branding_logo
          - user_menu
      - type: widget
        id: usage_summary
        fields:
          - current_plan
          - documents_processed_this_month
          - pages_processed_this_month
          - plan_limit_indicator
      - type: list
        id: recent_projects
        fields:
          - project_name
          - document_count
          - last_updated
      - type: list
        id: latest_extractions
        fields:
          - document_name
          - status
          - template_used
          - processed_at
      - type: button_group
        id: quick_actions
        actions:
          - upload_document
          - create_template
          - view_api_keys
  - id: S_projects_list
    name: Project Folders
    route: /app/projects
    purpose: Organize documents and templates into folders
    roles_allowed:
      - owner
      - member
      - readonly
    components:
      - type: list
        id: projects_table
        fields:
          - name
          - description
          - document_count
          - template_count
          - created_at
        actions:
          - open_project
          - rename
          - delete_project
      - type: button
        id: create_project_button
        actions:
          - create_project
  - id: S_project_detail
    name: Project Detail
    route: /app/projects/:projectId
    purpose: View documents and templates in a specific project
    roles_allowed:
      - owner
      - member
      - readonly
    components:
      - type: tabs
        id: project_tabs
        fields:
          - Documents
          - Templates
      - type: table
        id: documents_table
        fields:
          - file_name
          - status
          - template
          - uploaded_by
          - uploaded_at
          - pages
        actions:
          - upload_document
          - view_extraction
          - retry_extraction
      - type: table
        id: templates_table
        fields:
          - name
          - document_type
          - last_run
          - success_rate
        actions:
          - create_template
          - edit_template
          - duplicate_template
          - delete_template
  - id: S_document_upload
    name: Document Upload Form
    route: /app/upload
    purpose: Upload one or more documents to be processed
    roles_allowed:
      - owner
      - member
    components:
      - type: form
        id: upload_form
        fields:
          - project_selector
          - template_selector
          - files
          - priority_flag
        actions:
          - upload_and_process
          - cancel
  - id: S_template_editor
    name: Template Editor
    route: /app/templates/:templateId/edit
    purpose: Create and edit extraction templates and field mappings
    roles_allowed:
      - owner
      - member
    components:
      - type: form
        id: template_settings
        fields:
          - template_name
          - description
          - document_type
          - default_export_format
          - test_document_selector
      - type: panel
        id: field_definitions
        fields:
          - field_name
          - json_key
          - data_type
          - required
          - default_value
          - validation_rules
      - type: button_group
        id: template_actions
        actions:
          - save_template
          - run_test_extraction
          - delete_template
      - type: preview
        id: template_json_preview
        fields:
          - sample_output_json
  - id: S_extraction_preview
    name: Extraction Preview
    route: /app/documents/:documentId
    purpose: View extraction results, logs, and exports
    roles_allowed:
      - owner
      - member
      - readonly
    components:
      - type: panel
        id: document_info
        fields:
          - file_name
          - status
          - template_used
          - uploaded_by
          - uploaded_at
          - pages
      - type: tabs
        id: extraction_tabs
        fields:
          - JSON
          - Table
          - Logs
      - type: code_view
        id: json_view
        fields:
          - extracted_json
      - type: table
        id: table_view
        fields:
          - key
          - value
      - type: log_view
        id: logs_view
        fields:
          - timestamp
          - level
          - message
      - type: button_group
        id: export_buttons
        actions:
          - download_json
          - download_csv
          - download_excel
          - retry_extraction
  - id: S_api_keys
    name: API Key Management
    route: /app/settings/api-keys
    purpose: Create, view, and revoke API keys
    roles_allowed:
      - owner
      - member
    components:
      - type: table
        id: api_keys_table
        fields:
          - name
          - prefix
          - created_at
          - last_used_at
          - status
          - scopes
        actions:
          - revoke_key
      - type: form
        id: create_api_key_form
        fields:
          - name
          - scopes
          - expiration
        actions:
          - create_api_key
  - id: S_webhooks
    name: Webhook Setup
    route: /app/settings/webhooks
    purpose: Configure webhooks to receive extraction results
    roles_allowed:
      - owner
      - member
    components:
      - type: form
        id: webhook_config_form
        fields:
          - target_url
          - secret
          - events
          - retry_policy
          - enabled
        actions:
          - save_webhook
          - send_test_event
      - type: table
        id: webhook_logs_table
        fields:
          - timestamp
          - event
          - status_code
          - delivery_status
          - error_message
        actions:
          - view_payload
          - retry_delivery
  - id: S_integrations
    name: Integrations Guides
    route: /app/integrations
    purpose: Provide guides and configuration help for Make, Zapier, and n8n
    roles_allowed:
      - owner
      - member
      - readonly
    components:
      - type: tabs
        id: integrations_tabs
        fields:
          - Zapier
          - Make
          - n8n
          - REST API Docs
      - type: markdown
        id: zapier_guide
        fields:
          - step_by_step_instructions
          - example_requests
          - sample_payloads
      - type: markdown
        id: make_guide
        fields:
          - step_by_step_instructions
          - example_scenarios
      - type: markdown
        id: n8n_guide
        fields:
          - step_by_step_instructions
          - node_configuration
      - type: markdown
        id: api_docs
        fields:
          - authentication
          - endpoints_overview
          - sample_code_snippets
  - id: S_usage_billing
    name: Usage & Billing
    route: /app/settings/usage-billing
    purpose: View usage metering and manage subscription plans
    roles_allowed:
      - owner
    components:
      - type: chart
        id: usage_chart
        fields:
          - documents_per_day
          - pages_per_day
      - type: summary
        id: plan_summary
        fields:
          - current_plan
          - monthly_quota
          - used_this_period
          - overage_fees
      - type: button_group
        id: billing_actions
        actions:
          - open_billing_portal
          - upgrade_plan
          - downgrade_plan
  - id: S_admin_panel
    name: Admin Panel
    route: /admin
    purpose: Platform admin control panel
    roles_allowed:
      - admin
    components:
      - type: table
        id: workspaces_table
        fields:
          - workspace_name
          - owner_email
          - plan
          - status
          - created_at
        actions:
          - impersonate_owner
          - suspend_workspace
      - type: table
        id: system_metrics
        fields:
          - queue_depth
          - avg_processing_time
          - daily_docs_processed
          - errors_last_24h
      - type: table
        id: admin_audit_logs
        fields:
          - timestamp
          - actor
          - action
          - target
